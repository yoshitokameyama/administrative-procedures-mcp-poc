name: administrative-procedures-mcp

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required}
      PORT: "8080"
      UPSTREAM_URL: http://mcp-server:8000
    ports:
      - "8080:8080"
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public
      - private

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ADMIN_PROCEDURES_AUTH_CLIENT_ID: notion-poc
      ADMIN_PROCEDURES_PATH: /mcp
      ADMIN_PROCEDURES_REQUIRE_AUTH: "1"
      ADMIN_PROCEDURES_TRANSPORT: streamable-http
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required}
      MCP_NO_UI: "1"
      PORT: "8000"
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - private

networks:
  public:
  private:
    internal: true
