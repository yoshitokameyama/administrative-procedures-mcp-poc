name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra excel
      - run: uv run pytest

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build MCP server image
        run: docker build --tag administrative-procedures-mcp:test .
      - name: Build gateway image
        run: docker build --file gateway/Dockerfile --tag mcp-gateway:test .
